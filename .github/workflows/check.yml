name: check
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install -r examples/python/requirements.txt
      - run: python -m py_compile examples/python/order_app.py examples/python/slot_app.py
      - run: for f in scenarios/*.json; do python slot_app.py --check "$f"; done
        working-directory: examples/python
      - run: python conformance/check_python.py
      # 🧪 로컬 DVG 흉내로 예제를 끝까지 돌린다 — 도구와 예제가 서로 어긋나면 여기서 드러난다.
      - name: local_dvg — 주문 예제
        run: |
          python -m py_compile tools/local_dvg.py
          DVG_SIGNING_SECRET=ci-secret python examples/python/order_app.py & APP=$!
          sleep 2
          DVG_SIGNING_SECRET=ci-secret python tools/local_dvg.py --expect completed "강남역" "" "서초동" "착불" "네"
          DVG_SIGNING_SECRET=ci-secret python tools/local_dvg.py --expect transferred "강남역" "서초동" "착불" "아니요"
          kill "$APP"; wait "$APP" || true
      - name: local_dvg — 시나리오 엔진(대리운전)
        run: |
          DVG_SIGNING_SECRET=ci-secret DVG_APP_SCENARIO=examples/python/scenarios/driver.json python examples/python/slot_app.py & APP=$!
          sleep 2
          DVG_SIGNING_SECRET=ci-secret python tools/local_dvg.py --expect completed "강남역" "판교" "자동이요" "네"
          kill "$APP"; wait "$APP" || true
      - name: local_dvg — 꽃 배달 · DVG 답을 적은 파일(주소 좁히기) · --live
        run: |
          DVG_SIGNING_SECRET=ci-secret DVG_APP_SCENARIO=examples/python/scenarios/flower.json python examples/python/slot_app.py > /tmp/app.log 2>&1 & APP=$!
          sleep 2
          DVG_SIGNING_SECRET=ci-secret python tools/local_dvg.py --expect completed --file tools/calls/flower-narrowed.json
          DVG_SIGNING_SECRET=ci-secret python tools/local_dvg.py --live --expect completed --file tools/calls/flower-narrowed.json
          kill "$APP"; wait "$APP" || true
          # 시험 통화는 등록을 건너뛰고(--live 아님) --live 는 등록 함수를 부른다 — 각각 정확히 한 번
          test "$(grep -c '시험 통화 — 등록 건너뜀' /tmp/app.log)" = 1
          test "$(grep -c '등록(예제)' /tmp/app.log)" = 1
      - run: npm ci
        working-directory: examples/node
      - run: node --check examples/node/order_app.mjs
      - run: node conformance/check_node.mjs
      - uses: actions/setup-go@v5
        with: { go-version-file: examples/go/go.mod }
      - run: go vet ./... && go test ./... && go build ./...
        working-directory: examples/go
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -B -q package
        working-directory: examples/java
      # Rust — GitHub 러너에 stable 이 깔려 있다. 서식·린트·시험 벡터·릴리스 빌드.
      - run: cargo --version && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test && cargo build --release
        working-directory: examples/rust

  # 🖥 앱 개발사 콘솔 샘플 — 외부 의존성 없음 · 가짜 DVG 로 실제 HTTP 시험.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: for f in server.mjs public/*.js public/lib/*.js public/widgets/*.js; do node --check "$f"; done
        working-directory: console
      - run: npm test
        working-directory: console

  # 🚀 배포 파일 — 사이드카 실행 파일 문법 검사.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 스크립트 검사
        run: shellcheck -S warning deploy/sidecar/run
