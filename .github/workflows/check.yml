name: check
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install -r examples/python/requirements.txt
      - run: python -m py_compile examples/python/order_app.py examples/python/slot_app.py
      - run: for f in scenarios/*.json; do python slot_app.py --check "$f"; done
        working-directory: examples/python
      - run: python conformance/check_python.py
      - run: npm ci
        working-directory: examples/node
      - run: node --check examples/node/order_app.mjs
      - run: node conformance/check_node.mjs
      - uses: actions/setup-go@v5
        with: { go-version-file: examples/go/go.mod }
      - run: go vet ./... && go test ./... && go build ./...
        working-directory: examples/go

  # 🖥 앱 개발사 콘솔 샘플 — 외부 의존성 없음 · 가짜 DVG 로 실제 HTTP 시험.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: for f in server.mjs public/*.js public/lib/*.js public/widgets/*.js; do node --check "$f"; done
        working-directory: console
      - run: npm test
        working-directory: console

  # 📈 그라파나 템플릿 — 실제 프로메테우스·그라파나를 띄워 모든 패널 쿼리가 오류 없이 도는지 본다.
  grafana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 정적 검사
        run: python grafana/check/check_dashboards.py
      - name: 가짜 DVG
        run: |
          printf '%s' 'ci-token' > /tmp/dvg-token
          DVG_TOKEN_FILE=/tmp/dvg-token nohup python grafana/check/fake_exporter.py > /tmp/fake.log 2>&1 &
      - name: 예시 설정 문법(promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/grafana/prometheus:/p:ro" -v /tmp/dvg-token:/etc/prometheus/dvg-token:ro \
            prom/prometheus:v2.55.1 check config /p/prometheus.yml
      - name: 프로메테우스
        run: |
          docker run -d --name prom --network host \
            -v "$PWD/grafana/check/prometheus-ci.yml:/etc/prometheus/prometheus.yml:ro" \
            -v /tmp/dvg-token:/etc/prometheus/dvg-token:ro prom/prometheus:v2.55.1
      - name: 그라파나
        run: |
          docker run -d --name graf --network host \
            -e DVG_PROMETHEUS_URL=http://127.0.0.1:9090 -e GF_SECURITY_ADMIN_PASSWORD=ci \
            -v "$PWD/grafana/provisioning:/etc/grafana/provisioning:ro" \
            -v "$PWD/grafana/dashboards:/var/lib/grafana/dashboards/dvg:ro" grafana/grafana:11.3.0
      - name: 실시간 검사
        run: python grafana/check/check_dashboards.py --live --grafana-password ci --wait 120
      - name: 실패 시 로그
        if: failure()
        run: |
          cat /tmp/fake.log || true
          docker logs prom 2>&1 | tail -40 || true
          docker logs graf 2>&1 | tail -60 || true
