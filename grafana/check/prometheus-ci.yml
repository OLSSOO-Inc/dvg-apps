# CI 전용 — 가짜 DVG(check/fake_exporter.py)를 1초마다 긁는다.
global:
  scrape_interval: 1s
scrape_configs:
  - job_name: dvg
    metrics_path: /api/v1/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/dvg-token
    static_configs:
      - targets: ['127.0.0.1:9998']
