# /etc/nginx/conf.d/dvg-app-console.conf — 앱 개발사 콘솔(사용량 · 시뮬레이터)
#
# 콘솔 서버는 127.0.0.1:8790 에서만 열고, 밖에서는 이 HTTPS 주소로만 봅니다.
# 바꿀 곳: `console.example.com`(세 군데).
#
# 🔴 콘솔의 CONSOLE_PASSWORD 를 반드시 정하십시오 — 콘솔은 127.0.0.1 로 떠 있으면 비밀번호를
#    요구하지 않는데, nginx 가 그것을 밖으로 열면 누구나 사용량을 보고 시뮬레이터 횟수를 씁니다.

server {
    listen 443 ssl;
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass       http://127.0.0.1:8790;
        proxy_set_header Host $host;
        # 시뮬레이터는 DVG 가 앱과 대화를 끝까지 돌리므로 최대 1분 반 걸린다.
        proxy_read_timeout 120s;
    }
}
