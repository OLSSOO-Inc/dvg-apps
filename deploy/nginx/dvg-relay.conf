# /etc/nginx/conf.d/dvg-relay.conf — 앱의 relay 주소(wss)
#
# DVG 가 통화마다 이 주소로 **접속해 온다**(연결 방향: DVG → 앱). 앱 등록 때 relay 주소를
#   wss://app.example.com/dvg-relay
# 로 적습니다. 바꿀 곳은 둘뿐입니다: `app.example.com`(세 군데) 과 `/etc/nginx/dvg-allow.conf`.
#

# WebSocket 업그레이드 — 업그레이드가 아닌 요청은 연결을 닫는다.
map $http_upgrade $dvg_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /dvg-relay {
        # 🔴 DVG 서버에서 오는 접속만 받는다. 앱이 서명도 확인하지만(X-DVG-Signature),
        #    아무나 연결을 열게 두면 그 확인 전에 연결 수로 앱을 괴롭힐 수 있다.
        include /etc/nginx/dvg-allow.conf;

        proxy_pass         http://127.0.0.1:19999/relay;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $dvg_connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_buffering    off;

        # 통화 한 건 동안 연결이 이어진다 — 기본값(60초)이면 긴 통화가 중간에 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 그 밖의 경로는 없다.
    location / {
        return 404;
    }
}
